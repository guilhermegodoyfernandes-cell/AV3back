<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Godoy Autopeças</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container-fluid justify-content-center">
                <a class="navbar-brand" href="index.html"><img src="logo.png" alt="Godoy Autopeças"></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse flex-grow-0 justify-content-center" id="navbarNav">
                    <ul class="navbar-nav text-center align-items-lg-center">
                        <li class="nav-item"><a class="nav-link" href="index.html">Peças</a></li>
                        <li class="nav-item"><a class="nav-link" href="carrinho.html">Carrinho</a></li>
                        <li class="nav-item" id="nav-login"><a class="nav-link active" href="login.html">Entrar</a></li>
                    </ul>
                    <div class="dropdown m-3">
                        <button id="user-info" class="btn btn-danger dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="display: none">Olá</button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="cadastro.html">Meu perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">Sair</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main class="centro">
        <form id="form_login">
            <h1>Entrar</h1>
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="email@email.com" required class="input_texto">
            <label for="senha">Senha</label>
            <input type="password" id="senha" required class="input_texto">
            <p class="nota">Ainda não tem conta? <a href="./cadastro.html">Cadastre-se</a></p>
            <input type="submit" id="btn_enviar" value="Entrar" class="btn_enviar">
        </form>
    </main>
    <div class="toast-area">
        <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="5000">
            <div class="d-flex">
                <div class="toast-body" id="toast-message">Mensagem</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
            </div>
        </div>
    </div>
    <footer>Godoy Autopeças · Peças originais e de linha para o seu carro</footer>

    <script>
        const form = document.getElementById("form_login");
        const btn_enviar = document.getElementById("btn_enviar");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            btn_enviar.disabled = true;
            btn_enviar.value = "Entrando...";
            const dados = {
                email: document.getElementById("email").value,
                senha: document.getElementById("senha").value
            };
            try {
                const resposta = await fetch("http://localhost:3000/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(dados)
                });
                const json = await resposta.json();
                if (!resposta.ok) {
                    throw new Error(resposta.status === 401 ? json.msg : "Erro inesperado na API");
                }
                localStorage.setItem("nome_cliente", json.nome);
                localStorage.setItem("token", json.token);
                window.location.href = "index.html";
            } catch (error) {
                mostrarToast("Não foi possível entrar. " + error.message, "bg-danger");
                btn_enviar.disabled = false;
                btn_enviar.value = "Entrar";
            }
        });
    </script>
    <script src="./pages.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
